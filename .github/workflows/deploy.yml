name: Deploy PartReel to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 파생물 자동 빌드 (§20): 기여자는 원천 5파일만 내면 됨. index/svg/pages/api는 CI가 생성.
      # field_reports 집계도 이때 API에 반영 (GITHUB_TOKEN으로 이슈 조회).
      - name: Build derived artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 generators/build_index.py
          python3 generators/render_svg.py
          python3 generators/build_site.py
          python3 generators/build_api.py
          python3 generators/build_kicad_bundle.py
          python3 generators/build_kicad_api.py
          python3 generators/build_pcm.py

      # 교차검증 게이트: KiCad 파일 구조가 깨졌으면 배포 중단 (REQUIREMENTS §5-1)
      - name: Validate KiCad files
        run: python3 generators/validate_kicad.py

      - name: Check SVG text overlaps
        run: python3 generators/check_overlap.py

      - name: Check render completeness
        run: python3 generators/check_render.py

      - name: Check coplanar z-fighting in 3D
        run: |
          pip -q install trimesh numpy scipy
          python3 generators/check_zfight.py

      # 3D 에셋 R2 동기화(§21-D/§22): 커밋 diff가 아니라 **누락 기반** 대조.
      # 사유(2026-08-05 사건): concurrency 취소로 어떤 커밋의 배포가 건너뛰어지면
      # diff 기반은 그 커밋의 step/glb를 영영 안 올림 (PR #19 yeonho 4개 R2 404).
      # 대조 대상 = 체크아웃의 git 추적 step/glb 전체(~2.7k)에서 check_r2 검증
      # 스냅샷(docs/r2-verified.json) 기재분을 뺀 것 — 스냅샷은 200 검증 시에만
      # 기록되므로 미업로드 에셋은 반드시 대조에 남는다(연쇄 취소 안전, §22 실측).
      # 시크릿 없으면 건너뜀 (포크 CI 등).
      - name: Sync 3D assets to R2 (missing-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.R2_WRANGLER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 59c582799b858f66a23af4561c26c696
          MISSING_OK: "1"  # R2 전용 부품은 체크아웃에 3D가 없는 게 정상 — 개별 경고 생략
          SKIP_VERIFIED: "1"  # 검증 스냅샷 기재분은 HEAD 생략 (전량 HEAD ~9분 방지)
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "no R2 secret, skip"; exit 0; fi
          python3 generators/sync_r2.py --upload

      # R2 서빙 게이트(§22·§16): 업로드 후 실제 404가 없는지 검증, 있으면 배포 중단.
      # 스냅샷(docs/r2-verified.json) 대비 신규/변경분 전수 + 표본 300 HEAD — 수십 초.
      - name: Check R2 asset serving
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.R2_WRANGLER_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "no R2 secret, skip"; exit 0; fi
          python3 generators/check_r2.py

      # publish 정리: 사이트+라이브러리만 공개. generators/docs는 제외.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp index.json _site/
          cp -r assets _site/
          cp -r library _site/
          # 대용량 3D(step/glb)는 R2(assets.partreel.com)가 서빙 (§22) — Pages 예산 절약
          find _site/library -name "*.step" -delete
          find _site/library -name "*.glb" -delete
          cp -r p _site/
          cp -r kicad _site/
          cp -r pcm _site/
          cp -r about guide agents api browse _site/
          cp sitemap.xml robots.txt favicon.svg llms.txt _site/
          echo "partreel.com" > _site/CNAME

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
